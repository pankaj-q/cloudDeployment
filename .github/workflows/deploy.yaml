name: deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout role
        uses: actions/checkout@v5

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
             cd ~/advanceBackend/level5
             git pull
             sudo docker compose down
             sudo docker compose up -d --build
             



