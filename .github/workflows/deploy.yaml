name: deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout role
        uses: actions/checkout@v5

      - name: Check SSH secret
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "❌ SSH_KEY is EMPTY"
            exit 1
          fi

          echo "✅ SSH_KEY exists"
          echo "Length: ${#SSH_KEY}"
          echo "First line: $(echo "$SSH_KEY" | head -n 1)"
          echo "Last line: $(echo "$SSH_KEY" | tail -n 1)"

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/advanceBackend/level5
            git pull
            sudo docker compose down
            sudo docker compose up -d --build